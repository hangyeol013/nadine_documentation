<text x="214.0" y="304.0" text-anchor="middle" class="t">Google STT</text>
<rect x="99.0" y="342" width="230" height="46" rx="6" class="n-ma"/>
<text x="214.0" y="370.0" text-anchor="middle" class="t">Intent classifier</text>
<rect x="99.0" y="408" width="230" height="46" rx="6" class="n-ma"/>
<text x="214.0" y="436.0" text-anchor="middle" class="t">Affective appraisal · PAD</text>
<rect x="99.0" y="474" width="230" height="46" rx="6" class="n-ma"/>
<text x="214.0" y="502.0" text-anchor="middle" class="t">Orchestrator</text>
<rect x="99.0" y="540" width="230" height="46" rx="6" class="n-ma"/>
<text x="214.0" y="568.0" text-anchor="middle" class="t">Memory retrieval</text>
