<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 986" role="img" aria-label="Architecture comparison of the multi-agent and ReAct interaction layers" class="fig" style="overflow:visible">

<style>
  .fig { font-family: var(--md-text-font-family, Roboto, Helvetica, Arial, sans-serif); color: var(--md-default-fg-color, #222); }
  .fig text { fill: currentColor; }
  .fig .t  { font-size: 14px; }
  .fig .b  { font-size: 14px; font-weight: 700; }
  .fig .s  { font-size: 14px; fill: var(--md-default-fg-color--light, #555); }
  .fig .lane { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .fig .edge { fill: none; stroke: var(--md-default-fg-color--light, #777); stroke-width: 1.5; }
  .fig .lbl { font-size: 14px; font-style: italic; fill: var(--md-default-fg-color--light, #555); }
  .fig .band { fill: rgba(120,144,156,0.08); stroke: rgba(120,144,156,0.45); stroke-width: 1; }
  .fig .band-ma { fill: rgba(63,81,181,0.06); stroke: rgba(63,81,181,0.45); stroke-width: 1; }
  .fig .band-ra { fill: rgba(0,137,123,0.06); stroke: rgba(0,137,123,0.45); stroke-width: 1; }
  .fig .n-sh { fill: var(--md-default-bg-color, #fff); stroke: #78909c; stroke-width: 1.4; }
  .fig .n-ma { fill: var(--md-default-bg-color, #fff); stroke: #3f51b5; stroke-width: 1.4; }
  .fig .n-ra { fill: var(--md-default-bg-color, #fff); stroke: #00897b; stroke-width: 1.4; }
  .fig .n-ma-hi { fill: rgba(63,81,181,0.14); stroke: #3f51b5; stroke-width: 2.6; }
  .fig .n-ra-hi { fill: rgba(0,137,123,0.14); stroke: #00897b; stroke-width: 2.6; }
  .fig .ma { fill: #3f51b5; }
  .fig .ra { fill: #00897b; }
</style>


<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--md-default-fg-color--light, #777)"/>
  </marker>
</defs>

<rect x="20" y="16" width="960" height="118" rx="8" class="band"/>
<text x="34" y="38" class="lane">Perception layer · shared</text>
<rect x="21.0" y="54" width="230" height="46" rx="6" class="n-sh"/>
<text x="136.0" y="82.0" text-anchor="middle" class="t">RealSense RGB-D camera</text>
<path d="M251.0,77.0 L285.0,77.0" class="edge" marker-end="url(#arr)"/>
<rect x="285.0" y="54" width="400" height="46" rx="6" class="n-sh"/>
<text x="485.0" y="82.0" text-anchor="middle" class="t">YOLOv8 face tracking · InsightFace recognition*</text>
<path d="M685.0,77.0 L719.0,77.0" class="edge" marker-end="url(#arr)"/>
<rect x="719.0" y="54" width="260" height="46" rx="6" class="n-sh"/>
<text x="849.0" y="82.0" text-anchor="middle" class="t">Identity, 3D position, frames</text>
<text x="966" y="124" text-anchor="end" class="lbl">* recognition and selective visual memory in the multi-agent versions only; the ReAct build tracks the closest face for gaze</text>
<rect x="20" y="178" width="960" height="648" rx="8" class="band"/>
<text x="34" y="200" class="lane">Interaction layer · differs by family</text>
<rect x="34" y="214" width="560" height="598" rx="8" class="band-ma"/>
<text x="50" y="238" class="lane ma">Multi-agent graph · LangGraph</text>
<text x="50" y="258" class="s">Multi-Agent, Local  ·  Multi-Agent, Hybrid Cloud</text>
