<text x="787.0" y="698" text-anchor="middle" class="lbl">adding a capability adds a tool.</text>
<text x="787.0" y="726" text-anchor="middle" class="lbl">Emotion is appraised per turn;</text>
<text x="787.0" y="744" text-anchor="middle" class="lbl">no persistent affect, no visual memory.</text>
